<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }
        
        .player-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0a0e1a;
            padding-bottom: 10px;
        }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            gap: 15px;
        }
        
        .overlay.hidden {
            display: none;
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            background: #ffa500;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .play-button:active {
            transform: scale(0.95);
        }
        
        .play-button svg {
            width: 32px;
            height: 32px;
            fill: #000;
            margin-left: 4px;
        }
        
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 15px 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .btn.main {
            background: #ffa500;
            color: #000;
            width: 56px;
            height: 56px;
        }
        
        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        
        .btn.main svg {
            width: 24px;
            height: 24px;
        }
        
        .volume {
            flex: 1;
            max-width: 100px;
        }
        
        .volume input {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            -webkit-appearance: none;
        }
        
        .volume input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #ffa500;
            border-radius: 50%;
        }
        
        .channel-info {
            margin-top: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        
        .channel-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .channel-meta {
            font-size: 13px;
            color: #888;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .badge {
            background: rgba(255,165,0,0.2);
            color: #ffa500;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .live {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .live::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .channel-number {
            font-size: 28px;
            font-weight: 800;
            color: #ffa500;
            margin-bottom: 10px;
        }
        
        .section {
            margin-top: 15px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: #888;
        }
        
        .count {
            background: #ffa500;
            color: #000;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }
        
        .search {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        
        .search input::placeholder {
            color: #666;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        
        .tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .tab.active {
            background: rgba(255,165,0,0.2);
            color: #ffa500;
        }
        
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 12px;
            padding-bottom: 5px;
        }
        
        .categories::-webkit-scrollbar {
            display: none;
        }
        
        .category {
            background: rgba(255,255,255,0.08);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .category.active {
            background: #ffa500;
            color: #000;
            border-color: #ffa500;
        }
        
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .channel-item {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .channel-item:hover {
            background: rgba(255,255,255,0.08);
        }
        
        .channel-item.active {
            background: rgba(255,165,0,0.15);
            border-color: #ffa500;
        }
        
        .channel-item-num {
            font-size: 14px;
            font-weight: 700;
            color: #666;
            width: 40px;
            text-align: center;
        }
        
        .channel-item.active .channel-item-num {
            color: #ffa500;
        }
        
        .channel-item-logo {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            overflow: hidden;
        }
        
        .channel-item-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }
        
        .channel-item-info {
            flex: 1;
            min-width: 0;
        }
        
        .channel-item-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .channel-item-group {
            font-size: 12px;
            color: #888;
        }
        
        .favorite {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            cursor: pointer;
        }
        
        .favorite.active {
            color: #ffa500;
        }
        
        .favorite svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        
        .error-box {
            background: rgba(255,68,68,0.1);
            border: 2px solid rgba(255,68,68,0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
        }
        
        .error-box h3 {
            color: #ff4444;
            margin-bottom: 8px;
        }
        
        .error-box p {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        .btn-load {
            background: #ffa500;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin: 4px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .status {
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        
        .switch {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .toggle {
            width: 44px;
            height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            position: relative;
        }
        
        .toggle.active {
            background: #ffa500;
        }
        
        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: 0.2s;
        }
        
        .toggle.active::after {
            left: 22px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player-wrapper">
            <div class="channel-number" id="chNum">—</div>
            
            <div class="video-container">
                <video id="video" playsinline preload="metadata"></video>
                <div class="live">LIVE</div>
                
                <div class="overlay" id="overlay">
                    <div class="play-button" id="bigPlay">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn" id="btnPrev">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="btn main" id="btnPlay">
                        <svg viewBox="0 0 24 24" id="iconPlay"><path d="M8 5v14l11-7z"/></svg>
                        <svg viewBox="0 0 24 24" id="iconPause" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="btn" id="btnNext">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <div class="volume">
                        <input type="range" id="vol" min="0" max="1" step="0.1" value="1">
                    </div>
                    <button class="btn" id="btnMute">
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    </button>
                    <button class="btn" id="btnFull">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="channel-info">
                <div class="channel-title" id="chTitle">Выберите канал</div>
                <div class="channel-meta">
                    <span class="badge" id="chGroup">—</span>
                    <span id="chHost"></span>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <div class="section-title">КАНАЛЫ</div>
                <div class="count" id="count">0</div>
            </div>
            
            <div class="search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search" placeholder="Поиск каналов...">
            </div>
            
            <div class="tabs">
                <button class="tab active" data-tab="all">Все</button>
                <button class="tab" data-tab="fav">★ Избранное</button>
                <button class="tab" data-tab="hist">История</button>
            </div>
            
            <div class="categories" id="categories"></div>
            
            <div class="channel-list" id="list"></div>
            
            <div class="loading hidden" id="loading">Загрузка...</div>
            
            <div class="error-box hidden" id="error">
                <h3>Файл playlist.m3u не найден</h3>
                <p>Положите файл playlist.m3u рядом с этим HTML и откройте через локальный сервер</p>
                <button class="btn-load" onclick="document.getElementById('file').click()">Выбрать файл</button>
                <input type="file" id="file" accept=".m3u,.m3u8" class="hidden">
            </div>
        </div>
        
        <div class="status">
            <span id="status">Загрузка...</span>
            <label class="switch">
                <span>Авто</span>
                <div class="toggle active" id="autoSwitch"></div>
            </label>
        </div>
    </div>

    <script>
        // Состояние
        const state = {
            channels: [],
            current: -1,
            favorites: new Set(JSON.parse(localStorage.getItem('fav') || '[]')),
            history: JSON.parse(localStorage.getItem('hist') || '[]'),
            tab: 'all',
            category: 'all',
            search: '',
            auto: true,
            fails: 0,
            hls: null
        };

        // Элементы
        const $ = id => document.getElementById(id);
        const video = $('video');
        
        // Парсинг M3U
        function parseM3U(text) {
            const channels = [];
            const lines = text.split('\n');
            let current = null;
            const seen = new Set();
            
            for (let line of lines) {
                line = line.trim();
                
                if (line.startsWith('#EXTINF:')) {
                    // Извлекаем group-title
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const group = groupMatch ? groupMatch[1].trim() : 'Без группы';
                    
                    // Извлекаем tvg-logo
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1].trim() : '';
                    
                    // Извлекаем имя канала (после последней запятой)
                    const lastComma = line.lastIndexOf(',');
                    let name = lastComma > -1 ? line.substring(lastComma + 1).trim() : '';
                    
                    // Очищаем имя от кавычек и мусора
                    name = name
                        .replace(/^["']|["']$/g, '')
                        .replace(/\s+/g, ' ')
                        .trim();
                    
                    // Если имя пустое, используем дефолт
                    if (!name) name = 'Канал ' + (channels.length + 1);
                    
                    current = { name, group, logo };
                }
                else if (line && !line.startsWith('#') && current) {
                    if (line.match(/^https?:\/\//i)) {
                        const key = current.name.toLowerCase() + '|' + line;
                        if (!seen.has(key)) {
                            seen.add(key);
                            channels.push({
                                ...current,
                                url: line
                            });
                        }
                        current = null;
                    }
                }
            }
            
            return channels;
        }
        
        // Получение инициалов и цвета
        function getInitial(name) {
            return (name.match(/[a-zA-Zа-яА-Я0-9]/) || ['?'])[0].toUpperCase();
        }
        
        function getColor(name) {
            const colors = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#fd79a8','#a29bfe','#fdcb6e'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }
        
        // Рендер логотипа
        function renderLogo(ch) {
            if (ch.logo && ch.logo.startsWith('http')) {
                return `<img src="${ch.logo}" onerror="this.parentElement.innerHTML='<span style=\\'color:${getColor(ch.name)}\\'>${getInitial(ch.name)}</span>'">`;
            }
            return `<span style="color:${getColor(ch.name)}">${getInitial(ch.name)}</span>`;
        }
        
        // Фильтрация каналов
        function filter() {
            let result = [...state.channels];
            
            if (state.tab === 'fav') {
                result = result.filter(c => state.favorites.has(c.name));
            } else if (state.tab === 'hist') {
                const set = new Set(state.history);
                result = result.filter(c => set.has(c.name));
            }
            
            if (state.category !== 'all') {
                result = result.filter(c => c.group === state.category);
            }
            
            if (state.search) {
                const s = state.search.toLowerCase();
                result = result.filter(c => 
                    c.name.toLowerCase().includes(s) || 
                    c.group.toLowerCase().includes(s)
                );
            }
            
            return result;
        }
        
        // Рендер списка
        function render() {
            const filtered = filter();
            $('count').textContent = filtered.length;
            
            if (filtered.length === 0) {
                $('list').innerHTML = '<div style="text-align:center;padding:40px;color:#666">Нет каналов</div>';
                return;
            }
            
            $('list').innerHTML = filtered.map(ch => {
                const idx = state.channels.indexOf(ch);
                const active = idx === state.current;
                const fav = state.favorites.has(ch.name);
                
                return `
                    <div class="channel-item ${active ? 'active' : ''}" data-idx="${idx}">
                        <div class="channel-item-num">${String(idx + 1).padStart(3, '0')}</div>
                        <div class="channel-item-logo">${renderLogo(ch)}</div>
                        <div class="channel-item-info">
                            <div class="channel-item-name">${escapeHtml(ch.name)}</div>
                            <div class="channel-item-group">${escapeHtml(ch.group)}</div>
                        </div>
                        <div class="favorite ${fav ? 'active' : ''}" data-fav="${idx}">
                            <svg viewBox="0 0 24 24" fill="${fav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Обработчики
            document.querySelectorAll('.channel-item').forEach(el => {
                el.onclick = e => {
                    if (!e.target.closest('.favorite')) {
                        selectChannel(+el.dataset.idx);
                    }
                };
            });
            
            document.querySelectorAll('.favorite').forEach(el => {
                el.onclick = e => {
                    e.stopPropagation();
                    toggleFav(+el.dataset.fav);
                };
            });
        }
        
        // Рендер категорий
        function renderCategories() {
            const groups = {};
            state.channels.forEach(c => {
                groups[c.group] = (groups[c.group] || 0) + 1;
            });
            
            const sorted = Object.entries(groups).sort((a, b) => b[1] - a[1]);
            
            $('categories').innerHTML = `
                <div class="category ${state.category === 'all' ? 'active' : ''}" data-cat="all">
                    Все • ${state.channels.length}
                </div>
                ${sorted.map(([name, count]) => `
                    <div class="category ${state.category === name ? 'active' : ''}" data-cat="${name}">
                        ${escapeHtml(name)} • ${count}
                    </div>
                `).join('')}
            `;
            
            document.querySelectorAll('.category').forEach(el => {
                el.onclick = () => {
                    state.category = el.dataset.cat;
                    render();
                    document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                    el.classList.add('active');
                };
            });
        }
        
        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Выбор канала
        function selectChannel(idx) {
            if (idx < 0 || idx >= state.channels.length) return;
            
            state.current = idx;
            const ch = state.channels[idx];
            
            $('chNum').textContent = String(idx + 1).padStart(3, '0');
            $('chTitle').textContent = ch.name;
            $('chGroup').textContent = ch.group;
            $('chHost').textContent = new URL(ch.url).host;
            document.title = ch.name + ' — IPTV';
            
            play(ch.url);
            addHistory(ch.name);
            render();
            
            const item = document.querySelector(`.channel-item[data-idx="${idx}"]`);
            if (item) item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        // Воспроизведение
        function play(url) {
            if (state.hls) {
                state.hls.destroy();
                state.hls = null;
            }
            
            state.fails = 0;
            $('overlay').classList.remove('hidden');
            
            const canPlayNative = video.canPlayType('application/vnd.apple.mpegurl');
            
            if (canPlayNative) {
                video.src = url;
                video.play().catch(() => {});
            } else if (window.Hls && Hls.isSupported()) {
                state.hls = new Hls({
                    enableWorker: true,
                    manifestLoadingMaxRetry: 2,
                    levelLoadingMaxRetry: 2,
                    fragLoadingMaxRetry: 2
                });
                
                state.hls.loadSource(url);
                state.hls.attachMedia(video);
                
                state.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
                
                state.hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        state.fails++;
                        if (state.auto && state.fails < 3) {
                            setTimeout(() => nextChannel(), 1000);
                        }
                    }
                });
            } else {
                video.src = url;
                video.play().catch(() => {});
            }
        }
        
        // История
        function addHistory(name) {
            state.history = [name, ...state.history.filter(n => n !== name)].slice(0, 50);
            localStorage.setItem('hist', JSON.stringify(state.history));
        }
        
        // Избранное
        function toggleFav(idx) {
            const name = state.channels[idx].name;
            if (state.favorites.has(name)) {
                state.favorites.delete(name);
            } else {
                state.favorites.add(name);
            }
            localStorage.setItem('fav', JSON.stringify([...state.favorites]));
            render();
        }
        
        // Навигация
        function prevChannel() {
            if (state.current > 0) selectChannel(state.current - 1);
            else if (state.channels.length) selectChannel(state.channels.length - 1);
        }
        
        function nextChannel() {
            if (state.current < state.channels.length - 1) selectChannel(state.current + 1);
            else if (state.channels.length) selectChannel(0);
        }
        
        // Загрузка плейлиста
        async function loadPlaylist() {
            $('loading').classList.remove('hidden');
            $('error').classList.add('hidden');
            $('status').textContent = 'Загрузка playlist.m3u...';
            
            try {
                const res = await fetch('playlist.m3u');
                if (!res.ok) throw new Error();
                
                const text = await res.text();
                state.channels = parseM3U(text);
                
                if (!state.channels.length) throw new Error();
                
                $('status').textContent = `${state.channels.length} каналов`;
                renderCategories();
                render();
                
                if (state.current === -1) selectChannel(0);
            } catch (e) {
                $('error').classList.remove('hidden');
                $('status').textContent = 'Ошибка';
            } finally {
                $('loading').classList.add('hidden');
            }
        }
        
        // Загрузка файла
        $('file').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = ev => {
                state.channels = parseM3U(ev.target.result);
                $('status').textContent = `${state.channels.length} каналов · ${file.name}`;
                $('error').classList.add('hidden');
                renderCategories();
                render();
                if (state.current === -1) selectChannel(0);
            };
            reader.readAsText(file);
        };
        
        // Обработчики
        $('btnPlay').onclick = () => {
            if (video.paused) video.play();
            else video.pause();
        };
        
        $('bigPlay').onclick = () => {
            if (state.current >= 0) {
                if (video.paused) video.play();
            } else if (state.channels.length) {
                selectChannel(0);
            }
        };
        
        $('btnPrev').onclick = prevChannel;
        $('btnNext').onclick = nextChannel;
        
        $('btnFull').onclick = () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.querySelector('.video-container').requestFullscreen?.();
        };
        
        $('btnMute').onclick = () => {
            video.muted = !video.muted;
        };
        
        $('vol').oninput = e => {
            video.volume = e.target.value;
            video.muted = e.target.value == 0;
        };
        
        $('autoSwitch').onclick = () => {
            state.auto = !state.auto;
            $('autoSwitch').classList.toggle('active', state.auto);
        };
        
        // Табы
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                state.tab = tab.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                render();
            };
        });
        
        // Поиск
        $('search').oninput = e => {
            state.search = e.target.value;
            render();
        };
        
        // События видео
        video.onplay = () => {
            $('overlay').classList.add('hidden');
            $('iconPlay').classList.add('hidden');
            $('iconPause').classList.remove('hidden');
        };
        
        video.onpause = () => {
            $('iconPlay').classList.remove('hidden');
            $('iconPause').classList.add('hidden');
        };
        
        video.onplaying = () => {
            state.fails = 0;
            $('overlay').classList.add('hidden');
        };
        
        video.onerror = () => {
            state.fails++;
            if (state.auto && state.fails < 3) {
                setTimeout(nextChannel, 1000);
            }
        };
        
        // Клавиатура
        document.onkeydown = e => {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.key) {
                case 'ArrowUp': e.preventDefault(); prevChannel(); break;
                case 'ArrowDown': e.preventDefault(); nextChannel(); break;
                case ' ': e.preventDefault(); video.paused ? video.play() : video.pause(); break;
                case 'f': case 'F': if (state.current >= 0) toggleFav(state.current); break;
            }
        };
        
        // Старт
        loadPlaylist();
    </script>
</body>
</html>
