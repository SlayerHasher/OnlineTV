<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>IPTV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root {
    --bg: #0b0d17; --panel: #151826cc; --panel2: #1d2137;
    --accent: #6c5ce7; --accent2: #00d4ff; --text: #e8ebf5; --muted: #8b91a8;
    --danger: #ff4757; --ok: #26de81; --border: #2a2f47;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body {
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    background: radial-gradient(1200px 800px at 10% -10%, #2a1e5c 0%, transparent 50%),
                radial-gradient(1000px 700px at 110% 110%, #0c4a6e 0%, transparent 50%),
                var(--bg);
  }
  
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  
  .sidebar {
    background: var(--panel); backdrop-filter: blur(20px); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .logo { padding: 18px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .logo h1 {
    font-size: 16px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  
  .search { padding: 12px; border-bottom: 1px solid var(--border); }
  .search input {
    width: 100%; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); outline: none; transition: .2s; font-size: 14px;
  }
  .search input:focus { border-color: var(--accent); }
  
  .groups {
    padding: 8px; display: flex; flex-wrap: wrap; gap: 6px;
    border-bottom: 1px solid var(--border); max-height: 110px; overflow-y: auto;
  }
  .groups::-webkit-scrollbar { width: 4px; }
  .groups::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .group-chip {
    padding: 5px 10px; background: var(--panel2); border-radius: 20px; font-size: 12px; cursor: pointer;
    border: 1px solid transparent; transition: .2s; white-space: nowrap; color: var(--muted);
  }
  .group-chip:hover { border-color: var(--accent); color: var(--text); }
  .group-chip.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent;
  }
  
  .tools { padding: 8px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
  .tool-btn {
    flex: 1; padding: 8px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); cursor: pointer; font-size: 12px; transition: .2s;
  }
  .tool-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tool-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }
  
  .channels { flex: 1; overflow-y: auto; padding: 8px; }
  .channels::-webkit-scrollbar { width: 6px; }
  .channels::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  
  .channel {
    display: flex; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; transition: .15s;
    border: 1px solid transparent; align-items: center;
  }
  .channel:hover { background: var(--panel2); border-color: var(--border); }
  .channel.active {
    background: linear-gradient(90deg, rgba(108,92,231,.2), transparent);
    border-left: 3px solid var(--accent);
  }
  
  .channel-logo {
    width: 44px; height: 44px; border-radius: 8px; background: var(--panel2);
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .channel-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  .channel-logo .placeholder { font-size: 18px; font-weight: 700; color: var(--accent2); }
  
  .channel-info { flex: 1; overflow: hidden; }
  .channel-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-group { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  
  .fav-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px; transition: .2s; }
  .fav-btn:hover { color: var(--text); }
  .fav-btn.active { color: #ffd32a; }

  .main { display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .player-wrap { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  
  .empty-state { text-align: center; color: var(--muted); padding: 40px; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 5; }
  .empty-state .icon { font-size: 64px; margin-bottom: 20px; opacity: .3; }
  .empty-state h2 { margin-bottom: 10px; color: var(--text); font-size: 20px; }
  .empty-state p { font-size: 14px; max-width: 400px; line-height: 1.5; margin-bottom: 20px; }
  .empty-state code { background: var(--panel2); padding: 4px 8px; border-radius: 6px; font-family: monospace; color: var(--accent2); }
  
  .now-playing {
    padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; backdrop-filter: blur(20px);
  }
  .np-info { flex: 1; min-width: 0; }
  .np-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-group { font-size: 12px; color: var(--muted); }
  .np-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .np-btn {
    padding: 8px 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); cursor: pointer; font-size: 12px; transition: .2s;
  }
  .np-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  
  .loading {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: none;
    align-items: center; justify-content: center; z-index: 10; flex-direction: column; gap: 15px;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent2);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--muted); }
  
  .toast {
    position: fixed; bottom: 30px; right: 30px; padding: 12px 18px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; z-index: 200; display: none;
    animation: slideIn .3s; backdrop-filter: blur(20px); font-size: 14px;
  }
  @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .toast.show { display: block; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--ok); color: var(--ok); }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
    .sidebar { border-right: none; border-top: 1px solid var(--border); }
    .groups { max-height: 80px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">📡</div>
      <h1>IPTV Player</h1>
    </div>
    <div class="search">
      <input type="text" id="searchInput" placeholder="🔍 Поиск каналов..." />
    </div>
    <div class="groups" id="groupsContainer"></div>
    <div class="tools">
      <button class="tool-btn" onclick="document.getElementById('fileInput').click()">📁 Файл</button>
      <button class="tool-btn" onclick="showFavorites()">⭐ Избранное</button>
      <button class="tool-btn" onclick="resetToAll()">📋 Все</button>
      <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none" onchange="handleFileSelect(this)" />
    </div>
    <div class="channels" id="channelsContainer">
      <div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">
        <div class="spinner" style="margin:0 auto 15px; width:30px; height:30px;"></div>
        Загрузка playlist.m3u...
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="player-wrap" id="playerWrap">
      <video id="video" controls playsinline crossorigin="anonymous"></video>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка потока...</div>
      </div>
      <div class="empty-state" id="emptyState">
        <div class="icon">📺</div>
        <h2>Добро пожаловать!</h2>
        <p>Плеер автоматически ищет файл <code>playlist.m3u</code> в той же папке.<br>
        Если вы открыли файл напрямую (file://), браузер заблокирует загрузку.<br>
        Используйте локальный сервер:</p>
        <p><code>python3 -m http.server 8000</code></p>
        <button class="np-btn" style="margin-top:15px; font-size:14px; padding:10px 20px;" onclick="document.getElementById('fileInput').click()">
          Или выберите файл вручную
        </button>
      </div>
    </div>
    <div class="now-playing" id="nowPlaying" style="display:none">
      <div class="np-info">
        <div class="np-title" id="npTitle">—</div>
        <div class="np-group" id="npGroup">—</div>
      </div>
      <div class="np-actions">
        <button class="np-btn" onclick="togglePiP()" title="Картинка в картинке">🖼 PiP</button>
        <button class="np-btn" onclick="toggleFullscreen()" title="Полный экран">⛶</button>
        <button class="np-btn" onclick="reloadStream()" title="Перезагрузить поток">🔄</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// === STATE ===
let state = {
  channels: [],
  filtered: [],
  current: null,
  activeGroup: 'all',
  favorites: JSON.parse(localStorage.getItem('iptv_favs') || '[]'),
  showFavs: false
};

const video = document.getElementById('video');
let hls = null;

// === INITIALIZATION ===
document.addEventListener('DOMContentLoaded', () => {
  loadLocalPlaylist();
});

async function loadLocalPlaylist() {
  try {
    const res = await fetch('playlist.m3u');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    applyPlaylist(text);
    toast('Плейлист загружен ✓', 'success');
  } catch (e) {
    console.warn('Автозагрузка не удалась:', e);
    document.getElementById('channelsContainer').innerHTML = `
      <div style="padding:20px;text-align:center;color:var(--danger);font-size:13px">
        <b>Не удалось загрузить playlist.m3u</b><br><br>
        Убедитесь, что файл лежит рядом с index.html.<br>
        Откройте через локальный сервер:<br>
        <code style="background:var(--panel2);padding:4px 8px;border-radius:4px;display:inline-block;margin:8px 0">python3 -m http.server 8000</code><br><br>
        <button class="tool-btn" style="width:100%;margin-top:10px" onclick="document.getElementById('fileInput').click()">📁 Выбрать файл вручную</button>
      </div>
    `;
  }
}

function handleFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    applyPlaylist(e.target.result);
    toast('Файл загружен ✓', 'success');
  };
  reader.readAsText(file);
  input.value = ''; // сброс для повторного выбора того же файла
}

// === M3U PARSER (Исправлен и усилен) ===
function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  const channels = [];
  let current = null;
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    
    if (line.startsWith('#EXTINF')) {
      // Берем ПЕРВОЕ совпадение group-title (часто бывает два, нам нужен настоящий, а не источник)
      const groupMatch = line.match(/group-title="([^"]*)"/i);
      const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
      
      // Имя канала - это всё после ПОСЛЕДНЕЙ запятой
      const lastComma = line.lastIndexOf(',');
      let name = lastComma > -1 ? line.substring(lastComma + 1).trim() : 'Unknown';
      
      // Очистка имени от кавычек, HTML-мусора и лишних пробелов
      name = name
        .replace(/^["']|["']$/g, '')
        .replace(/<[^>]*>/g, '')
        .replace(/&quot;/g, '"')
        .replace(/&amp;/g, '&')
        .replace(/\s+/g, ' ')
        .trim();
      
      if (!name) name = 'Канал ' + (channels.length + 1);

      current = {
        name: name,
        logo: logoMatch ? logoMatch[1].trim() : '',
        group: groupMatch ? groupMatch[1].trim() : 'Без группы',
        url: ''
      };
    } else if (!line.startsWith('#') && current) {
      if (line.match(/^https?:\/\//i)) {
        current.url = line;
        channels.push(current);
        current = null;
      }
    }
  }
  return channels;
}

function applyPlaylist(text) {
  state.channels = parseM3U(text);
  state.showFavs = false;
  state.activeGroup = 'all';
  
  document.getElementById('emptyState').style.display = state.channels.length ? 'none' : 'block';
  renderGroups();
  renderChannels();
}

// === RENDER ===
function renderGroups() {
  // Собираем уникальные группы, сортируем по количеству каналов
  const groupCounts = {};
  state.channels.forEach(c => {
    groupCounts[c.group] = (groupCounts[c.group] || 0) + 1;
  });
  
  const sortedGroups = Object.entries(groupCounts).sort((a, b) => b[1] - a[1]).map(([name]) => name);
  const groups = ['all', '⭐ Избранное', ...sortedGroups];
  
  const container = document.getElementById('groupsContainer');
  container.innerHTML = groups.map(g => {
    const count = g === 'all' ? state.channels.length : 
                  g === '⭐ Избранное' ? state.favorites.length : 
                  groupCounts[g];
    const displayName = g === 'all' ? '📋 Все' : g;
    return `
      <div class="group-chip ${g === state.activeGroup ? 'active' : ''}" onclick="setGroup('${g.replace(/'/g, "\\'")}')">
        ${displayName} <span style="opacity:0.7">(${count})</span>
      </div>
    `;
  }).join('');
}

function setGroup(g) {
  state.activeGroup = g;
  state.showFavs = (g === '⭐ Избранное');
  renderGroups();
  renderChannels();
}

function showFavorites() {
  setGroup('⭐ Избранное');
}

function resetToAll() {
  setGroup('all');
}

function renderChannels() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let list = state.channels;
  
  if (state.showFavs) {
    list = list.filter(c => state.favorites.includes(c.url));
  } else if (state.activeGroup !== 'all') {
    list = list.filter(c => c.group === state.activeGroup);
  }
  
  if (search) {
    list = list.filter(c => c.name.toLowerCase().includes(search) || c.group.toLowerCase().includes(search));
  }
  
  state.filtered = list;
  const container = document.getElementById('channelsContainer');
  
  if (!list.length) {
    container.innerHTML = `<div style="padding:30px;text-align:center;color:var(--muted);font-size:13px">Ничего не найдено</div>`;
    return;
  }
  
  // Оптимизированный рендер (DocumentFragment не нужен для <1000 элементов, innerHTML быстрее)
  container.innerHTML = list.map((c) => {
    const isActive = state.current && state.current.url === c.url;
    const isFav = state.favorites.includes(c.url);
    const initial = (c.name.match(/[a-zA-Zа-яА-Я0-9]/) || ['?'])[0].toUpperCase();
    const colors = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#fd79a8','#a29bfe','#fdcb6e'];
    const color = colors[c.name.split('').reduce((a,b)=>a+b.charCodeAt(0),0) % colors.length];
    
    const logoHtml = c.logo && c.logo.startsWith('http') 
      ? `<img src="${c.logo}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
         <div class="placeholder" style="display:none;color:${color}">${initial}</div>`
      : `<div class="placeholder" style="color:${color}">${initial}</div>`;

    return `
    <div class="channel ${isActive ? 'active' : ''}" onclick="playChannelByUrl('${c.url.replace(/'/g, "\\'")}')">
      <div class="channel-logo">
        ${logoHtml}
      </div>
      <div class="channel-info">
        <div class="channel-name">${escapeHtml(c.name)}</div>
        <div class="channel-group">${escapeHtml(c.group)}</div>
      </div>
      <button class="fav-btn ${isFav ? 'active' : ''}"
              onclick="event.stopPropagation();toggleFav('${c.url.replace(/'/g, "\\'")}')">★</button>
    </div>
  `}).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// === PLAYER (Стабильная версия из твоего кода) ===
function playChannelByUrl(url) {
  const ch = state.channels.find(c => c.url === url);
  if (!ch) return;
  
  state.current = ch;
  document.getElementById('npTitle').textContent = ch.name;
  document.getElementById('npGroup').textContent = ch.group;
  document.getElementById('nowPlaying').style.display = 'flex';
  document.getElementById('emptyState').style.display = 'none';
  
  loadStream(ch.url);
  renderChannels(); // Обновляем активный класс
}

function loadStream(url) {
  document.getElementById('loading').classList.add('show');
  
  if (hls) {
    hls.destroy();
    hls = null;
  }
  video.src = '';

  if (url.includes('.m3u8') || url.includes('m3u8')) {
    if (Hls.isSupported()) {
      hls = new Hls({
        maxBufferLength: 30,
        enableWorker: true,
        manifestLoadingMaxRetry: 3,
        levelLoadingMaxRetry: 3,
        fragLoadingMaxRetry: 3
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(()=>{});
        document.getElementById('loading').classList.remove('show');
      });
      
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          document.getElementById('loading').classList.remove('show');
          toast('Ошибка потока: ' + data.type, 'error');
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari fallback
      video.src = url;
      video.addEventListener('loadedmetadata', () => {
        video.play().catch(()=>{});
        document.getElementById('loading').classList.remove('show');
      }, {once: true});
    }
  } else {
    // Прямые ссылки (mp4 и т.д.)
    video.src = url;
    video.play().then(() => {
      document.getElementById('loading').classList.remove('show');
    }).catch(err => {
      document.getElementById('loading').classList.remove('show');
      toast('Не удалось запустить: ' + err.message, 'error');
    });
  }
}

function reloadStream() {
  if (state.current) {
    loadStream(state.current.url);
  }
}

function togglePiP() {
  if (document.pictureInPictureElement) {
    document.exitPictureInPicture();
  } else if (document.pictureInPictureEnabled) {
    video.requestPictureInPicture().catch(()=>{});
  }
}

function toggleFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.getElementById('playerWrap').requestFullscreen().catch(()=>{});
  }
}

// === FAVORITES ===
function toggleFav(url) {
  if (state.favorites.includes(url)) {
    state.favorites = state.favorites.filter(f => f !== url);
  } else {
    state.favorites.push(url);
  }
  localStorage.setItem('iptv_favs', JSON.stringify(state.favorites));
  renderChannels();
  if (state.activeGroup === '⭐ Избранное') renderGroups(); // Обновить счетчик
}

// === UI HELPERS ===
function toast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// === EVENT LISTENERS ===
document.getElementById('searchInput').addEventListener('input', renderChannels);

document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  switch(e.key.toLowerCase()) {
    case ' ':
      e.preventDefault();
      video.paused ? video.play() : video.pause();
      break;
    case 'f':
      toggleFullscreen();
      break;
    case 'p':
      togglePiP();
      break;
    case 'm':
      video.muted = !video.muted;
      break;
    case 'r':
      reloadStream();
      break;
    case 'arrowup':
      e.preventDefault();
      video.volume = Math.min(1, video.volume + 0.1);
      break;
    case 'arrowdown':
      e.preventDefault();
      video.volume = Math.max(0, video.volume - 0.1);
      break;
    case 'l': {
      if (!state.current) return;
      const idx = state.filtered.findIndex(c => c.url === state.current.url);
      if (idx < state.filtered.length - 1) playChannelByUrl(state.filtered[idx + 1].url);
      break;
    }
    case 'k': {
      if (!state.current) return;
      const idx = state.filtered.findIndex(c => c.url === state.current.url);
      if (idx > 0) playChannelByUrl(state.filtered[idx - 1].url);
      break;
    }
    case 's':
      if (state.current) toggleFav(state.current.url);
      break;
  }
});

video.addEventListener('playing', () => document.getElementById('loading').classList.remove('show'));
video.addEventListener('error', () => {
  document.getElementById('loading').classList.remove('show');
