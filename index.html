<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Плейлист - Просмотр каналов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 2px solid #e9ecef;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6c757d;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            padding-left: 45px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 1.2em;
        }

        .filter-select {
            padding: 12px 20px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .channels-container {
            padding: 30px;
        }

        .category-section {
            margin-bottom: 30px;
        }

        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-header:hover {
            transform: translateX(5px);
        }

        .category-name {
            font-size: 1.3em;
            font-weight: bold;
        }

        .category-count {
            background: rgba(255, 255, 255, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .channel-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .channel-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-3px);
        }

        .channel-card.has-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .channel-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 8px;
            background: #f8f9fa;
            padding: 5px;
        }

        .channel-info {
            flex: 1;
        }

        .channel-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .channel-url {
            font-size: 0.85em;
            color: #6c757d;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .channel-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .channel-card:hover .channel-actions {
            opacity: 1;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .epg-badge {
            background: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-left: 8px;
        }

        .no-channels {
            text-align: center;
            padding: 50px;
            color: #6c757d;
            font-size: 1.2em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #212529;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #6c757d;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #dc3545;
        }

        .url-textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9em;
            resize: vertical;
            min-height: 150px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
        }

        .toast.active {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .channels-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }
        }

        .collapsed .channels-grid {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 1.5em;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📺 IPTV Плейлист</h1>
            <p>Список русских телеканалов с EPG поддержкой</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalChannels">0</div>
                <div class="stat-label">Всего каналов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalCategories">0</div>
                <div class="stat-label">Категорий</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="epgChannels">0</div>
                <div class="stat-label">С EPG</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="lastUpdate">-</div>
                <div class="stat-label">Обновлено</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Поиск канала...">
            </div>
            <select class="filter-select" id="categoryFilter">
                <option value="">Все категории</option>
            </select>
            <button class="btn btn-primary" onclick="downloadPlaylist()">💾 Скачать M3U</button>
            <button class="btn btn-secondary" onclick="copyPlaylistUrl()">📋 Копировать URL</button>
        </div>

        <div class="channels-container" id="channelsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <div>Загрузка плейлиста...</div>
            </div>
        </div>
    </div>

    <div class="modal" id="channelModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Информация о канале</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast">Скопировано в буфер обмена!</div>

    <script>
        let channels = [];
        let categories = {};

        // Загрузка плейлиста
        async function loadPlaylist() {
            try {
                const response = await fetch('playlist.m3u');
                const text = await response.text();
                parseM3U(text);
                renderChannels();
                updateStats();
            } catch (error) {
                console.error('Ошибка загрузки плейлиста:', error);
                document.getElementById('channelsContainer').innerHTML = 
                    '<div class="no-channels">❌ Ошибка загрузки плейлиста. Убедитесь, что файл playlist.m3u существует.</div>';
            }
        }

        // Парсинг M3U
        function parseM3U(content) {
            const lines = content.split('\n');
            let currentChannel = null;

            channels = [];
            categories = {};

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {
                        name: '',
                        url: '',
                        group: '',
                        logo: '',
                        tvgId: '',
                        hasEpg: false
                    };

                    // Извлекаем атрибуты
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch) currentChannel.group = groupMatch[1];

                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch) currentChannel.logo = logoMatch[1];

                    const tvgIdMatch = line.match(/tvg-id="([^"]*)"/);
                    if (tvgIdMatch) {
                        currentChannel.tvgId = tvgIdMatch[1];
                        currentChannel.hasEpg = true;
                    }

                    // Извлекаем имя канала
                    const nameMatch = line.match(/,(.+)$/);
                    if (nameMatch) currentChannel.name = nameMatch[1].trim();

                } else if (line.startsWith('http') && currentChannel) {
                    currentChannel.url = line;
                    
                    // Добавляем в категорию
                    if (!categories[currentChannel.group]) {
                        categories[currentChannel.group] = [];
                    }
                    categories[currentChannel.group].push(currentChannel);
                    channels.push(currentChannel);
                    
                    currentChannel = null;
                }
            }

            // Сортируем категории
            Object.keys(categories).forEach(cat => {
                categories[cat].sort((a, b) => a.name.localeCompare(b.name));
            });
        }

        // Рендеринг каналов
        function renderChannels(filterText = '', filterCategory = '') {
            const container = document.getElementById('channelsContainer');
            container.innerHTML = '';

            let hasResults = false;

            for (const [category, categoryChannels] of Object.entries(categories)) {
                // Фильтрация по категории
                if (filterCategory && category !== filterCategory) continue;

                // Фильтрация по поиску
                const filtered = categoryChannels.filter(ch => {
                    if (!filterText) return true;
                    const search = filterText.toLowerCase();
                    return ch.name.toLowerCase().includes(search) || 
                           ch.url.toLowerCase().includes(search);
                });

                if (filtered.length === 0) continue;

                hasResults = true;

                const section = document.createElement('div');
                section.className = 'category-section';
                section.dataset.category = category;

                const header = document.createElement('div');
                header.className = 'category-header';
                header.onclick = () => section.classList.toggle('collapsed');
                header.innerHTML = `
                    <span class="category-name">${category}</span>
                    <span class="category-count">${filtered.length}</span>
                `;
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'channels-grid';

                filtered.forEach(channel => {
                    const card = createChannelCard(channel);
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }

            if (!hasResults) {
                container.innerHTML = '<div class="no-channels">😕 Каналы не найдены</div>';
            }
        }

        // Создание карточки канала
        function createChannelCard(channel) {
            const card = document.createElement('div');
            card.className = 'channel-card';
            
            const hasLogo = channel.logo && !channel.logo.startsWith('data:image');
            if (hasLogo) {
                card.classList.add('has-logo');
            }

            card.innerHTML = `
                ${hasLogo ? `<img src="${channel.logo}" alt="${channel.name}" class="channel-logo" onerror="this.style.display='none'">` : ''}
                <div class="${hasLogo ? 'channel-info' : ''}">
                    <div class="channel-name">
                        ${channel.name}
                        ${channel.hasEpg ? '<span class="epg-badge">EPG</span>' : ''}
                    </div>
                    <div class="channel-url">${channel.url}</div>
                </div>
                <div class="channel-actions">
                    <button class="action-btn" onclick="event.stopPropagation(); copyUrl('${channel.url}')" title="Копировать URL">📋</button>
                    <button class="action-btn" onclick="event.stopPropagation(); showChannelInfo('${channel.name}')" title="Информация">ℹ️</button>
                </div>
            `;

            card.onclick = () => showChannelInfo(channel.name);
            return card;
        }

        // Обновление статистики
        function updateStats() {
            document.getElementById('totalChannels').textContent = channels.length;
            document.getElementById('totalCategories').textContent = Object.keys(categories).length;
            document.getElementById('epgChannels').textContent = channels.filter(ch => ch.hasEpg).length;
            
            // Загружаем время обновления из stats.json
            fetch('stats.json')
                .then(r => r.json())
                .then(stats => {
                    if (stats.generated) {
                        const date = new Date(stats.generated);
                        document.getElementById('lastUpdate').textContent = 
                            date.toLocaleDateString('ru-RU') + ' ' + date.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
                    }
                })
                .catch(() => {
                    document.getElementById('lastUpdate').textContent = '-';
                });
        }

        // Поиск
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const categoryFilter = document.getElementById('categoryFilter').value;
            renderChannels(e.target.value, categoryFilter);
        });

        // Фильтр по категориям
        document.getElementById('categoryFilter').addEventListener('change', (e) => {
            const searchText = document.getElementById('searchInput').value;
            renderChannels(searchText, e.target.value);
        });

        // Заполнение фильтра категорий
        function populateCategoryFilter() {
            const select = document.getElementById('categoryFilter');
            select.innerHTML = '<option value="">Все категории</option>';
            
            Object.keys(categories).sort().forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = `${cat} (${categories[cat].length})`;
                select.appendChild(option);
            });
        }

        // Показать информацию о канале
        function showChannelInfo(channelName) {
            const channel = channels.find(ch => ch.name === channelName);
            if (!channel) return;

            const modal = document.getElementById('channelModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = channel.name;
            modalBody.innerHTML = `
                <p><strong>Категория:</strong> ${channel.group || 'Не указана'}</p>
                <p><strong>URL:</strong></p>
                <textarea class="url-textarea" readonly>${channel.url}</textarea>
                ${channel.logo ? `<p><strong>Логотип:</strong><br><img src="${channel.logo}" style="max-width: 200px; margin-top: 10px;" onerror="this.style.display='none'"></p>` : ''}
                ${channel.tvgId ? `<p><strong>tvg-id:</strong> ${channel.tvgId}</p>` : ''}
                <p><strong>EPG:</strong> ${channel.hasEpg ? '✅ Доступно' : '❌ Не доступно'}</p>
                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="copyUrl('${channel.url}')">📋 Копировать URL</button>
                    <button class="btn btn-secondary" onclick="playChannel('${channel.url}')">▶️ Воспроизвести</button>
                </div>
            `;

            modal.classList.add('active');
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('channelModal').classList.remove('active');
        }

        // Копирование URL
        function copyUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('URL скопирован в буфер обмена!');
            }).catch(err => {
                // Fallback для старых браузеров
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('URL скопирован в буфер обмена!');
            });
        }

        // Копирование URL плейлиста
        function copyPlaylistUrl() {
            const url = window.location.href.replace(/\/[^\/]*$/, '/playlist.m3u');
            copyUrl(url);
        }

        // Скачать плейлист
        function downloadPlaylist() {
            const link = document.createElement('a');
            link.href = 'playlist.m3u';
            link.download = 'playlist.m3u';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Плейлист скачивается...');
        }

        // Воспроизведение канала
        function playChannel(url) {
            window.open(`https://vlc-web-player.github.io/vlc-web-player/#${url}`, '_blank');
            showToast('Открывается VLC Web Player...');
        }

        // Уведомление
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Закрытие модального окна по клику вне
        document.getElementById('channelModal').addEventListener('click', (e) => {
            if (e.target.id === 'channelModal') {
                closeModal();
            }
        });

        // Инициализация
        window.addEventListener('DOMContentLoaded', () => {
            loadPlaylist();
        });
    </script>
</body>
</html>
