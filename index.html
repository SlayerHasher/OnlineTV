<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="format-detection" content="telephone=no">
    <title>IPTV Player</title>

    <!-- DNS Prefetch для ускорения -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Плееры -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>

    <style>
        /* ═══ RESET + БАЗА ═══ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
            scroll-behavior: smooth;
            /* Фикс iOS rubber-banding */
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            /* Безопасные зоны (notch) */
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
            /* GPU-ускорение */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        /* ═══ КОНТЕЙНЕР ═══ */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0));
        }

        /* ═══ ПЛЕЕР (STICKY) ═══ */
        .player-wrapper {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0a0e1a;
            padding-bottom: 10px;
            /* Тень при скролле */
            -webkit-box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            /* Fallback для старых браузеров */
            padding-top: 56.25%; /* 16:9 */
            height: 0;
            /* GPU layer */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            will-change: transform;
        }

        /* Современные браузеры */
        @supports (aspect-ratio: 16/9) {
            .video-container {
                padding-top: 0;
                height: auto;
                aspect-ratio: 16/9;
            }
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -o-object-fit: contain;
            object-fit: contain;
            background: #000;
            /* Аппаратное декодирование */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        /* ═══ ОВЕРЛЕИ ═══ */
        .overlay {
            position: absolute;
            inset: 0;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            gap: 15px;
            z-index: 10;
        }

        .overlay.hidden { display: none; }

        .play-button {
            width: 80px;
            height: 80px;
            background: #ffa500;
            border-radius: 50%;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            cursor: pointer;
            -webkit-transition: -webkit-transform 0.15s ease;
            transition: transform 0.15s ease;
            /* Минимальная зона нажатия */
            min-width: 48px;
            min-height: 48px;
        }

        .play-button:active {
            -webkit-transform: scale(0.9);
            transform: scale(0.9);
        }

        .play-button svg { width: 32px; height: 32px; fill: #000; margin-left: 4px; }

        /* Буферизация */
        .buffering {
            position: absolute;
            inset: 0;
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            z-index: 9;
            pointer-events: none;
        }

        .buffering.hidden { display: none; }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255,165,0,0.25);
            border-top-color: #ffa500;
            border-radius: 50%;
            -webkit-animation: spin 0.7s linear infinite;
            animation: spin 0.7s linear infinite;
        }

        @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
        @keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }

        /* Бейджи */
        .format-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.75);
            color: #4ecdc4;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            font-family: 'SF Mono', 'Fira Code', monospace;
            z-index: 5;
            letter-spacing: 0.5px;
        }

        .live {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            gap: 5px;
            z-index: 5;
        }

        .live::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            -webkit-animation: pulse 1.5s infinite;
            animation: pulse 1.5s infinite;
        }

        @-webkit-keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* ═══ КОНТРОЛЫ ═══ */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 50px 12px calc(12px + env(safe-area-inset-bottom, 0));
            background: -webkit-gradient(linear, left top, left bottom, from(transparent), to(rgba(0,0,0,0.92)));
            background: linear-gradient(transparent, rgba(0,0,0,0.92));
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            gap: 8px;
            z-index: 11;
            /* Скрытие при бездействии */
            -webkit-transition: opacity 0.3s;
            transition: opacity 0.3s;
        }

        .controls.idle { opacity: 0; pointer-events: none; }

        .btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 50%;
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            cursor: pointer;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            /* Убираем задержку 300ms на мобильных */
            touch-action: manipulation;
        }

        .btn:active { background: rgba(255,255,255,0.3); }

        .btn.main {
            background: #ffa500;
            color: #000;
            width: 52px;
            height: 52px;
            min-width: 52px;
            min-height: 52px;
        }

        .btn svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
        .btn.main svg { width: 22px; height: 22px; }

        .volume {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            max-width: 90px;
            min-width: 50px;
        }

        .volume input[type="range"] {
            width: 100%;
            height: 44px; /* Большая зона нажатия */
            background: transparent;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .volume input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }

        .volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #ffa500;
            border-radius: 50%;
            margin-top: -7px;
        }

        .volume input[type="range"]::-moz-range-track {
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            border: none;
        }

        .volume input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #ffa500;
            border-radius: 50%;
            border: none;
        }

        /* ═══ ИНФО О КАНАЛЕ ═══ */
        .channel-info {
            margin-top: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .channel-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-meta {
            font-size: 12px;
            color: #888;
            display: -webkit-box;
            display: flex;
            gap: 6px;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            -webkit-box-align: center;
            align-items: center;
        }

        .badge {
            background: rgba(255,165,0,0.2);
            color: #ffa500;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge.fmt { background: rgba(78,205,196,0.2); color: #4ecdc4; }

        .channel-number {
            font-size: 24px;
            font-weight: 800;
            color: #ffa500;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        /* ═══ СЕКЦИЯ КАНАЛОВ ═══ */
        .section { margin-top: 15px; }

        .section-header {
            display: -webkit-box;
            display: flex;
            -webkit-box-pack: justify;
            justify-content: space-between;
            -webkit-box-align: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #888; letter-spacing: 1px; }

        .count {
            background: #ffa500;
            color: #000;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Поиск */
        .search {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 0 15px;
            margin-bottom: 12px;
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            gap: 10px;
            height: 48px; /* Тач-френдли */
        }

        .search svg { -webkit-flex-shrink: 0; flex-shrink: 0; opacity: 0.5; }

        .search input {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 16px; /* ≥16px — iOS не зумит */
            outline: none;
            height: 100%;
        }

        .search input::placeholder { color: #555; }

        /* Табы */
        .tabs {
            display: -webkit-box;
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .tab {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            padding: 12px 8px;
            background: none;
            border: none;
            color: #888;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 44px;
        }

        .tab.active { background: rgba(255,165,0,0.2); color: #ffa500; }

        /* Категории */
        .categories {
            display: -webkit-box;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 12px;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .categories::-webkit-scrollbar { display: none; }

        .category {
            background: rgba(255,255,255,0.08);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            touch-action: manipulation;
            min-height: 40px;
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
        }

        .category.active { background: #ffa500; color: #000; border-color: #ffa500; font-weight: 600; }

        /* ═══ СПИСОК КАНАЛОВ ═══ */
        .channel-list {
            display: -webkit-box;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-flex-direction: column;
            flex-direction: column;
            gap: 6px;
            /* Виртуальный скролл */
            contain: layout style;
        }

        .channel-item {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px 12px;
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            -webkit-transition: background 0.15s, border-color 0.15s;
            transition: background 0.15s, border-color 0.15s;
            touch-action: manipulation;
            min-height: 64px;
            /* GPU */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            contain: layout;
        }

        .channel-item:active { background: rgba(255,255,255,0.1); }
        .channel-item.active { background: rgba(255,165,0,0.12); border-color: #ffa500; }

        .channel-item-num {
            font-size: 12px;
            font-weight: 700;
            color: #555;
            width: 36px;
            text-align: center;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .channel-item.active .channel-item-num { color: #ffa500; }

        .channel-item-logo {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            overflow: hidden;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }

        .channel-item-logo img {
            width: 100%;
            height: 100%;
            -o-object-fit: contain;
            object-fit: contain;
            padding: 4px;
        }

        .channel-item-info {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            min-width: 0;
        }

        .channel-item-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-item-group { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .favorite {
            width: 44px;
            height: 44px;
            display: -webkit-box;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            color: #555;
            cursor: pointer;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        .favorite.active { color: #ffa500; }
        .favorite svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }

        /* ═══ ОШИБКИ / ЗАГРУЗКА ═══ */
        .error-box {
            background: rgba(255,68,68,0.08);
            border: 2px solid rgba(255,68,68,0.25);
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            margin: 15px 0;
        }

        .error-box h3 { color: #ff4444; margin-bottom: 8px; font-size: 16px; }
        .error-box p { color: #888; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }

        .btn-load {
            background: #ffa500;
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin: 4px;
            min-height: 48px;
            touch-action: manipulation;
        }

        .btn-load:active { opacity: 0.8; }

        .loading { text-align: center; padding: 40px; color: #888; font-size: 14px; }

        .player-error {
            position: absolute;
            inset: 0;
            display: -webkit-box;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            background: rgba(0,0,0,0.92);
            z-index: 12;
            gap: 10px;
            padding: 20px;
            text-align: center;
        }

        .player-error.hidden { display: none; }
        .player-error .err-icon { font-size: 36px; }
        .player-error .err-msg { color: #ff6b6b; font-size: 14px; font-weight: 600; }
        .player-error .err-detail { color: #666; font-size: 11px; max-width: 280px; word-break: break-all; }

        .btn-retry {
            background: #ffa500;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            min-height: 44px;
            touch-action: manipulation;
        }

        /* ═══ СТАТУС ═══ */
        .status {
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 11px;
            color: #888;
            display: -webkit-box;
            display: flex;
            -webkit-box-pack: justify;
            justify-content: space-between;
            -webkit-box-align: center;
            align-items: center;
            margin-top: 12px;
        }

        .switch { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; gap: 8px; cursor: pointer; }

        .toggle {
            width: 44px;
            height: 26px;
            background: rgba(255,255,255,0.2);
            border-radius: 13px;
            position: relative;
            -webkit-transition: background 0.2s;
            transition: background 0.2s;
        }

        .toggle.active { background: #ffa500; }

        .toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            -webkit-transition: left 0.2s;
            transition: left 0.2s;
        }

        .toggle.active::after { left: 21px; }

        .hidden { display: none !important; }

        /* ═══ АДАПТИВ ═══ */
        /* Маленькие телефоны (≤360px) */
        @media (max-width: 360px) {
            .container { padding: 6px; }
            .channel-item { padding: 8px 10px; gap: 8px; }
            .channel-item-logo { width: 38px; height: 38px; }
            .channel-item-num { width: 30px; font-size: 11px; }
            .channel-title { font-size: 14px; }
            .controls { gap: 5px; padding: 40px 8px 8px; }
            .btn { width: 40px; height: 40px; min-width: 40px; min-height: 40px; }
            .btn.main { width: 48px; height: 48px; min-width: 48px; min-height: 48px; }
            .volume { max-width: 60px; }
        }

        /* Планшеты и десктоп */
        @media (min-width: 768px) {
            .container { padding: 20px; }
            .channel-item { padding: 14px 16px; }
            .channel-item-logo { width: 52px; height: 52px; }
            .channel-title { font-size: 18px; }
        }

        /* Ландшафт на телефоне */
        @media (max-height: 500px) and (orientation: landscape) {
            .player-wrapper { position: relative; }
            .video-container { max-height: 45vh; }
            .channel-number { display: none; }
            .channel-info { display: none; }
        }

        /* Тёмная тема принудительная */
        @media (prefers-color-scheme: light) {
            /* Остаёмся тёмными — это видеоплеер */
            :root { color-scheme: dark; }
        }

        /* Уменьшенная анимация */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                -webkit-animation-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                -webkit-transition-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Печать — скрываем */
        @media print { body { display: none; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="player-wrapper">
            <div class="channel-number" id="chNum">—</div>

            <div class="video-container" id="videoWrap">
                <video id="video" playsinline webkit-playsinline preload="auto"
                       x5-video-player-type="h5" x5-video-player-fullscreen="true"
                       x5-video-orientation="landscape"></video>
                <div class="live">LIVE</div>

                    </button>

            <div class="channel-info">
                <div class="channel-title" id="chTitle">Выберите канал</div>
                <div class="channel-meta">

        <div class="section">
            <div class="section-header">
                <div class="section-title">Каналы</div>
                <div class="count" id="count">0</div>
            </div>

            <div class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search" placeholder="Поиск каналов..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

            <div class="tabs">

                <button class="tab" data-tab="fav">★ Избр.</button>
                <button class="tab" data-tab="hist">История</button>

            <div class="categories" id="categories"></div>

            <div class="error-box hidden" id="error">
                <h3>Ошибка загрузки</h3>
                <p>Не удалось загрузить плейлист. Проверьте интернет-соединение.</p>
                <button class="btn-load" id="btnFile">Выбрать файл</button>
                <button class="btn-load" id="btnReload">Повторить</button>
                <input type="file" id="file" accept=".m3u,.m3u8,.txt" class="hidden">
            </div>
        </div>

        <div class="status">
            <span id="status">Инициализация...</span>
            <label class="switch">
                <span>Авто</span>
                <div class="toggle active" id="autoSwitch"></div>
            </label>
        </div>
    </div>

<script>
'use strict';

// ═══════════════════════════════════════════════════
//  УТИЛИТЫ
// ═══════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const video = $('video');

function safeParse(key, def) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? def; }
    catch { return def; }
}
function safeSave(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s) {
    return s.replace(/["'<>&]/g, c => ({'"':'&quot;',"'":'&#39;','<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
}
function debounce(fn, ms) {
    let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function throttle(fn, ms) {
    let last = 0;
    return (...a) => { const now = Date.now(); if (now - last >= ms) { last = now; fn(...a); } };
}

// ═══════════════════════════════════════════════════
//  СОСТОЯНИЕ
// ═══════════════════════════════════════════════════
const state = {
    channels: [],
    current: -1,
    favorites: new Set(safeParse('iptv_fav', [])),
    history: safeParse('iptv_hist', []),
    tab: 'all',
    category: 'all',
    search: '',
    auto: true,
    fails: 0,
    player: null,
    playerType: null,
    fallbackChain: [],
    fallbackIdx: 0,
    controlsTimer: null,
    preloaded: { next: null, prev: null }
};

// ═══════════════════════════════════════════════════
//  ОПРЕДЕЛЕНИЕ ФОРМАТА
// ═══════════════════════════════════════════════════
function detectFormat(url) {
    const u = url.toLowerCase().split('?')[0].split('#')[0];
    if (/\.m3u8$|\/hls\/|m3u8/.test(u)) return 'hls';
    if (/\.mpd$|\/dash\/|manifest\.mpd/.test(u)) return 'dash';
    if (/\.ts$|\/mpegts\/|\/ts\//.test(u)) return 'mpegts';
    if (/\.flv$|\/flv\/|http-flv/.test(u)) return 'flv';
    if (/\.(mp4|webm|ogg|ogv|mov)$/.test(u)) return 'native';
    if (/\.(aac|mp3|opus|flac)$/.test(u)) return 'native';
    return 'unknown';
}

function getFallbackChain(url) {
    const p = detectFormat(url);
    if (p !== 'unknown') return [p];
    return ['hls', 'mpegts', 'dash', 'native'];
}

const FORMAT_LABELS = { hls:'HLS', dash:'DASH', mpegts:'TS', flv:'FLV', native:'MP4' };
function formatLabel(t) { return FORMAT_LABELS[t] || t.toUpperCase(); }

// ═══════════════════════════════════════════════════
//  ПАРСЕР M3U (оптимизированный)
// ═══════════════════════════════════════════════════
function parseM3U(text) {
    const channels = [];
    const lines = text.split(/\r?\n/);
    const len = lines.length;
    let cur = null;
    const seen = new Set();

    for (let i = 0; i < len; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.charCodeAt(0) === 35) { // '#'
            if (line.startsWith('#EXTINF:')) {
                const group = extractAttr(line, 'group-title') || 'Без группы';
                const logo = extractAttr(line, 'tvg-logo') || '';
                const comma = line.lastIndexOf(',');
                let name = comma > -1 ? line.substring(comma + 1).trim() : '';
                name = name.replace(/^["']+|["']+$/g, '').replace(/\s+/g, ' ');
                if (!name) name = 'Канал ' + (channels.length + 1);
                cur = { name, group, logo };
            } else if (line.startsWith('#EXTGRP:') && cur) {
                cur.group = line.substring(8).trim() || cur.group;
            }
        } else if (cur && (line.startsWith('http://') || line.startsWith('https://'))) {
            const key = cur.name + '|' + line;
            if (!seen.has(key)) {
                seen.add(key);
                channels.push({ name: cur.name, group: cur.group, logo: cur.logo, url: line });
            }
            cur = null;
        }
    }
    return channels;
}

function extractAttr(line, attr) {
    const idx = line.indexOf(attr + '="');
    if (idx === -1) return '';
    const start = idx + attr.length + 2;
    const end = line.indexOf('"', start);
    return end > start ? line.substring(start, end).trim() : '';
}

// ═══════════════════════════════════════════════════
//  ПЛЕЕР — УНИВЕРСАЛЬНЫЙ
// ═══════════════════════════════════════════════════
function destroyPlayer() {
    if (state.player) {
        try {
            if (state.playerType === 'hls') state.player.destroy();
            else if (state.playerType === 'dash') state.player.reset();
            else if (state.playerType === 'mpegts' || state.playerType === 'flv') {
                state.player.pause(); state.player.unload();
                state.player.detachMediaElement(); state.player.destroy();
            }
        } catch(e) {}
        state.player = null;
        state.playerType = null;
    }
    video.removeAttribute('src');
    video.load();
}

function playWithFormat(url, format) {
    destroyPlayer();
    state.playerType = format;
    $('formatBadge').textContent = formatLabel(format);
    $('formatBadge').classList.remove('hidden');
    $('chFormat').textContent = formatLabel(format);
    $('playerError').classList.add('hidden');
    showBuffering(true);

    switch (format) {
        case 'hls': playHLS(url); break;
        case 'dash': playDASH(url); break;
        case 'mpegts': case 'flv': playMpegts(url, format); break;
        default: playNative(url); break;
    }
}

function playHLS(url) {
    // Нативный HLS (Safari, iOS, macOS)
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
        state.playerType = 'native';
        video.src = url;
        video.play().catch(()=>{});
        return;
    }
    if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 30,
            maxBufferLength: 10,
            maxMaxBufferLength: 30,
            manifestLoadingMaxRetry: 2,
            manifestLoadingRetryDelay: 500,
            levelLoadingMaxRetry: 2,
            levelLoadingRetryDelay: 500,
            fragLoadingMaxRetry: 3,
            fragLoadingRetryDelay: 500,
            startLevel: -1, // авто качество
            capLevelToPlayerSize: true,
            // Быстрый старт
            initialLiveManifestSize: 1,
            startFragPrefetch: true
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
        hls.on(Hls.Events.ERROR, (e, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && state.fails < 2) {
                state.fails++; hls.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
            } else {
                handleStreamError('HLS: ' + (data.details || 'ошибка'));
            }
        });
        state.player = hls;
    } else {
        playNative(url);
    }
}

function playDASH(url) {
    if (window.dashjs) {
        const p = dashjs.MediaPlayer().create();
        p.initialize(video, url, true);
        p.updateSettings({
            streaming: {
                abr: { autoSwitchBitrate: { video: true, audio: true } },
                buffer: { bufferTimeAtTopQuality: 15, bufferToKeep: 10, bufferAhead: 15 },
                retryAttempts: { MPD: 2, MediaSegment: 3, InitializationSegment: 2 },
                retryIntervals: { MPD: 500, MediaSegment: 500 },
                delay: { liveDelay: 2 } // Минимальная задержка для live
            }
        });
        p.on(dashjs.MediaPlayer.events.ERROR, e => handleStreamError('DASH: ' + (e.error?.message||'')));
        p.on(dashjs.MediaPlayer.events.PLAYBACK_STARTED, () => { state.fails=0; showBuffering(false); });
        state.player = p;
    } else { playNative(url); }
}

function playMpegts(url, format) {
    if (window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
        const p = mpegts.createPlayer({
            type: format === 'flv' ? 'flv' : 'mpegts',
            isLive: true,
            url: url
        }, {
            enableWorker: true,
            enableStashBuffer: true,
            stashInitialSize: 384,
            liveBufferLatencyChasing: true,
            liveBufferLatencyMaxLatency: 1.5,
            liveBufferLatencyMinRemain: 0.3,
            autoCleanupSourceBuffer: true,
            fixAudioTimestampGap: true,
            // Быстрый старт
            lazyLoad: false,
            lazyLoadMaxDuration: 0
        });
        p.attachMediaElement(video);
        p.load();
        p.play();
        p.on(mpegts.Events.ERROR, (t, d) => handleStreamError('TS: ' + t + ' ' + d));
        state.player = p;
    } else { playNative(url); }
}

function playNative(url) {
    state.playerType = 'native';
    video.src = url;
    video.play().catch(()=>{});
}

// ═══════════════════════════════════════════════════
//  FALLBACK / ОШИБКИ
// ═══════════════════════════════════════════════════
function handleStreamError(msg) {
    state.fails++;
    showBuffering(false);

    if (state.fallbackIdx < state.fallbackChain.length - 1) {
        state.fallbackIdx++;
        setTimeout(() => {
            if (state.current >= 0) playWithFormat(state.channels[state.current].url, state.fallbackChain[state.fallbackIdx]);
        }, 300);
        return;
    }

    if (state.auto && state.fails < 4) {
        setTimeout(nextChannel, 1000);
    } else {
        $('playerError').classList.remove('hidden');
        $('errMsg').textContent = msg || 'Поток недоступен';
        $('errDetail').textContent = state.channels[state.current]?.url?.substring(0, 80) || '';
    }
}

function showBuffering(show) { $('buffering').classList.toggle('hidden', !show); }

// ═══════════════════════════════════════════════════
//  ПРЕДЗАГРУЗКА СОСЕДНИХ КАНАЛОВ (DNS + TCP)
// ═══════════════════════════════════════════════════
function preloadNeighbors() {
    if (state.current < 0 || !state.channels.length) return;
    const urls = [];
    const next = (state.current + 1) % state.channels.length;
    const prev = (state.current - 1 + state.channels.length) % state.channels.length;
    urls.push(state.channels[next].url, state.channels[prev].url);

    // DNS prefetch + preconnect через скрытые link-элементы
    urls.forEach(url => {
        try {
            const host = new URL(url).origin;
            if (!document.querySelector(`link[href="${host}"]`)) {
                const link = document.createElement('link');
                link.rel = 'preconnect';
                link.href = host;
                link.crossOrigin = 'anonymous';
                document.head.appendChild(link);
                // Удаляем через 10с чтобы не засорять
                setTimeout(() => link.remove(), 10000);
            }
        } catch {}
    });
}

// ═══════════════════════════════════════════════════
//  ВЫБОР КАНАЛА
// ═══════════════════════════════════════════════════
function selectChannel(idx) {
    if (idx < 0 || idx >= state.channels.length) return;

    state.current = idx;
    state.fails = 0;
    state.fallbackIdx = 0;

    const ch = state.channels[idx];
    state.fallbackChain = getFallbackChain(ch.url);

    $('chNum').textContent = String(idx + 1).padStart(3, '0');
    $('chTitle').textContent = ch.name;
    $('chGroup').textContent = ch.group;
    try { $('chHost').textContent = new URL(ch.url).host; } catch {}
    document.title = ch.name + ' — IPTV';

    $('overlay').classList.add('hidden');
    $('playerError').classList.add('hidden');

    playWithFormat(ch.url, state.fallbackChain[0]);
    addHistory(ch.name);
    renderList();
    preloadNeighbors();

    // Скролл к активному
    requestAnimationFrame(() => {
        const el = document.querySelector('.channel-item.active');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
}

// ═══════════════════════════════════════════════════
//  РЕНДЕРИНГ (оптимизированный)
// ═══════════════════════════════════════════════════
function getInitial(name) {
    for (let i = 0; i < name.length; i++) {
        const c = name.charCodeAt(i);
        if ((c >= 65 && c <= 90) || (c >= 97 && c <= 122) || (c >= 1040 && c <= 1103) || (c >= 48 && c <= 57))
            return name[i].toUpperCase();
    }
    return '?';
}

const COLORS = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#fd79a8','#a29bfe','#fdcb6e'];
function getColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return COLORS[Math.abs(h) % COLORS.length];
}

function filterChannels() {
    let r = state.channels;

    if (state.tab === 'fav') r = r.filter(c => state.favorites.has(c.name));
    else if (state.tab === 'hist') {
        const s = new Set(state.history);
        r = r.filter(c => s.has(c.name));
    }

    if (state.category !== 'all') r = r.filter(c => c.group === state.category);

    if (state.search) {
        const q = state.search.toLowerCase();
        r = r.filter(c => c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
    }

    return r;
}

// Кэширование DOM
let lastRenderKey = '';

function renderList() {
    const filtered = filterChannels();
    $('count').textContent = filtered.length;

    const key = state.tab + state.category + state.search + state.current;
    if (key === lastRenderKey) return;
    lastRenderKey = key;

    if (!filtered.length) {
        $('list').innerHTML = '<div style="text-align:center;padding:40px;color:#555;font-size:14px">Нет каналов</div>';
        return;
    }

    const MAX = 150;
    const slice = filtered.slice(0, MAX);
    const frag = document.createDocumentFragment();

    for (let i = 0; i < slice.length; i++) {
        const ch = slice[i];
        const idx = state.channels.indexOf(ch);
        const active = idx === state.current;
        const fav = state.favorites.has(ch.name);

        const div = document.createElement('div');
        div.className = 'channel-item' + (active ? ' active' : '');
        div.dataset.idx = idx;

        const color = getColor(ch.name);
        const init = getInitial(ch.name);
        const logoHtml = ch.logo && ch.logo.startsWith('http')
            ? `<img src="${escapeAttr(ch.logo)}" loading="lazy" decoding="async" onerror="this.outerHTML='<span style=color:${color}>${init}</span>'">`
            : `<span style="color:${color}">${init}</span>`;

        div.innerHTML = `
            <div class="channel-item-num">${String(idx+1).padStart(3,'0')}</div>
            <div class="channel-item-logo">${logoHtml}</div>
            <div class="channel-item-info">
                <div class="channel-item-name">${escapeHtml(ch.name)}</div>
                <div class="channel-item-group">${escapeHtml(ch.group)}</div>
            </div>
            <div class="favorite${fav?' active':''}" data-fav="${idx}">
                <svg viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </div>`;
        frag.appendChild(div);
    }

    if (filtered.length > MAX) {
        const more = document.createElement('div');
        more.style.cssText = 'text-align:center;padding:15px;color:#555;font-size:12px';
        more.textContent = `Показано ${MAX} из ${filtered.length}. Уточните поиск.`;
        frag.appendChild(more);
    }

    $('list').innerHTML = '';
    $('list').appendChild(frag);
}

function renderCategories() {
    const groups = Object.create(null);
    for (const c of state.channels) groups[c.group] = (groups[c.group] || 0) + 1;
    const sorted = Object.entries(groups).sort((a, b) => b[1] - a[1]);

    let html = `<div class="category${state.category==='all'?' active':''}" data-cat="all">Все · ${state.channels.length}</div>`;
    for (const [name, count] of sorted) {
        html += `<div class="category${state.category===name?' active':''}" data-cat="${escapeAttr(name)}">${escapeHtml(name)} · ${count}</div>`;
    }
    $('categories').innerHTML = html;
}

// ═══════════════════════════════════════════════════
//  ИСТОРИЯ / ИЗБРАННОЕ
// ═══════════════════════════════════════════════════
function addHistory(name) {
    state.history = [name, ...state.history.filter(n => n !== name)].slice(0, 50);
    safeSave('iptv_hist', state.history);
}

function toggleFav(idx) {
    const name = state.channels[idx]?.name;
    if (!name) return;
    state.favorites.has(name) ? state.favorites.delete(name) : state.favorites.add(name);
    safeSave('iptv_fav', [...state.favorites]);
    lastRenderKey = '';
    renderList();
}

// ═══════════════════════════════════════════════════
//  НАВИГАЦИЯ
// ═══════════════════════════════════════════════════
function prevChannel() {
    if (!state.channels.length) return;
    selectChannel(state.current > 0 ? state.current - 1 : state.channels.length - 1);
}
function nextChannel() {
    if (!state.channels.length) return;
    selectChannel(state.current < state.channels.length - 1 ? state.current + 1 : 0);
}

// ═══════════════════════════════════════════════════
//  ЗАГРУЗКА ПЛЕЙЛИСТА
// ═══════════════════════════════════════════════════
async function loadPlaylist() {
    $('loading').classList.remove('hidden');
    $('error').classList.add('hidden');
    $('status').textContent = 'Загрузка...';

    const urls = [
        'https://raw.githubusercontent.com/SlayerHasher/OnlineTV/main/playlist.m3u'
    ];

    for (const url of urls) {
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 12000);
            const res = await fetch(url, { signal: ctrl.signal });
            clearTimeout(timer);
            if (!res.ok) continue;
            const text = await res.text();
            state.channels = parseM3U(text);
            if (state.channels.length) {
                $('status').textContent = state.channels.length + ' каналов';
                renderCategories();
                renderList();
                if (state.current === -1) selectChannel(0);
                $('loading').classList.add('hidden');
                return;
            }
        } catch { continue; }
    }

    $('error').classList.remove('hidden');
    $('status').textContent = 'Ошибка';
    $('loading').classList.add('hidden');
}

// ═══════════════════════════════════════════════════
//  ОБРАБОТЧИКИ
// ═══════════════════════════════════════════════════

// Делегирование кликов по списку
$('list').addEventListener('click', e => {
    const fav = e.target.closest('.favorite');
    if (fav) { toggleFav(+fav.dataset.fav); return; }
    const item = e.target.closest('.channel-item');
    if (item) selectChannel(+item.dataset.idx);
}, { passive: true });

// Категории
$('categories').addEventListener('click', e => {
    const el = e.target.closest('.category');
    if (!el) return;
    state.category = el.dataset.cat;
    lastRenderKey = '';
    renderList();
    $('categories').querySelectorAll('.category').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
}, { passive: true });

// Табы
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        state.tab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        lastRenderKey = '';
        renderList();
    }, { passive: true });
});

// Поиск (debounce)
$('search').addEventListener('input', debounce(e => {
    state.search = e.target.value.trim();
    lastRenderKey = '';
    renderList();
}, 200), { passive: true });

// Плеер
$('btnPlay').addEventListener('click', () => video.paused ? video.play() : video.pause());
$('bigPlay').addEventListener('click', () => {
    if (state.current >= 0) video.play();
    else if (state.channels.length) selectChannel(0);
});
$('btnPrev').addEventListener('click', prevChannel);
$('btnNext').addEventListener('click', nextChannel);
$('btnMute').addEventListener('click', () => { video.muted = !video.muted; });
$('vol').addEventListener('input', e => {
    video.volume = +e.target.value;
    video.muted = +e.target.value === 0;
    safeSave('iptv_vol', +e.target.value);
}, { passive: true });

$('btnFull').addEventListener('click', () => {
    const el = $('videoWrap');
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    }
});

$('btnRetry').addEventListener('click', () => {
    if (state.current >= 0) { state.fails = 0; state.fallbackIdx = 0; selectChannel(state.current); }
});

$('autoSwitch').addEventListener('click', () => {
    state.auto = !state.auto;
    $('autoSwitch').classList.toggle('active', state.auto);
});

$('btnFile').addEventListener('click', () => $('file').click());
$('btnReload').addEventListener('click', loadPlaylist);

$('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
        state.channels = parseM3U(ev.target.result);
        $('status').textContent = state.channels.length + ' · ' + f.name;
        $('error').classList.add('hidden');
        renderCategories();
        lastRenderKey = '';
        renderList();
        if (state.current === -1 && state.channels.length) selectChannel(0);
    };
    reader.readAsText(f);
});

// ═══════════════════════════════════════════════════
//  СОБЫТИЯ ВИДЕО
// ═══════════════════════════════════════════════════
video.addEventListener('play', () => {
    $('overlay').classList.add('hidden');
    $('playerError').classList.add('hidden');
    $('iconPlay').classList.add('hidden');
    $('iconPause').classList.remove('hidden');
});

video.addEventListener('pause', () => {
    $('iconPlay').classList.remove('hidden');
    $('iconPause').classList.add('hidden');
});

video.addEventListener('playing', () => {
    state.fails = 0;
    showBuffering(false);
    $('overlay').classList.add('hidden');
});

video.addEventListener('waiting', () => showBuffering(true), { passive: true });
video.addEventListener('canplay', () => showBuffering(false), { passive: true });
video.addEventListener('stalled', () => showBuffering(true), { passive: true });

video.addEventListener('error', () => {
    showBuffering(false);
    if (state.playerType === 'native') handleStreamError('Ошибка декодирования');
}, { passive: true });

// ═══════════════════════════════════════════════════
//  АВТОСКРЫТИЕ КОНТРОЛОВ (тач + мышь)
// ═══════════════════════════════════════════════════
function showControls() {
    $('controls').classList.remove('idle');
    clearTimeout(state.controlsTimer);
    state.controlsTimer = setTimeout(() => {
        if (!video.paused) $('controls').classList.add('idle');
    }, 3500);
}

$('videoWrap').addEventListener('touchstart', showControls, { passive: true });
$('videoWrap').addEventListener('mousemove', throttle(showControls, 500), { passive: true });

// ═══════════════════════════════════════════════════
//  СВАЙПЫ (переключение каналов)
// ═══════════════════════════════════════════════════
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

$('videoWrap').addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
}, { passive: true });

$('videoWrap').addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const dt = Date.now() - touchStartTime;

    // Горизонтальный свайп > 60px, быстрый < 300ms
    if (Math.abs(dx) > 60 && Math.abs(dy) < 40 && dt < 300) {
        if (dx > 0) prevChannel();
        else nextChannel();
    }
    // Двойной тап — фуллскрин (обрабатывается отдельно)
}, { passive: true });

// Двойной тап → фуллскрин
let lastTap = 0;
$('videoWrap').addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300) {
        $('btnFull').click();
        e.preventDefault();
    }
    lastTap = now;
});

// ═══════════════════════════════════════════════════
//  КЛАВИАТУРА
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.key) {
        case 'ArrowUp': e.preventDefault(); prevChannel(); break;
        case 'ArrowDown': e.preventDefault(); nextChannel(); break;
        case ' ': e.preventDefault(); video.paused ? video.play() : video.pause(); break;
        case 'f': case 'F': if (state.current >= 0) toggleFav(state.current); break;
        case 'm': case 'M': video.muted = !video.muted; break;
        case 'ArrowRight': video.volume = Math.min(1, video.volume + 0.1); $('vol').value = video.volume; break;
        case 'ArrowLeft': video.volume = Math.max(0, video.volume - 0.1); $('vol').value = video.volume; break;
    }
});

// ═══════════════════════════════════════════════════
//  ЭКОНОМИЯ БАТАРЕИ / ВИДИМОСТЬ
// ═══════════════════════════════════════════════════
document.addEventListener('visibilitychange', () => {
    if (document.hidden && !video.paused) {
        // Ставим на паузу если вкладка скрыта (экономия)
        // Раскомментируйте если нужно:
        // video.pause();
    }
});

// Page Visibility API для остановки рендера
let isVisible = true;
document.addEventListener('visibilitychange', () => { isVisible = !document.hidden; });

// ═══════════════════════════════════════════════════
//  ВОССТАНОВЛЕНИЕ ГРОМКОСТИ
// ═══════════════════════════════════════════════════
const savedVol = safeParse('iptv_vol', null);
if (savedVol !== null) { video.volume = savedVol; $('vol').value = savedVol; }

// ═══════════════════════════════════════════════════
//  СТАРТ
// ═══════════════════════════════════════════════════
// Загружаем плейлист немедленно
loadPlaylist();

// Service Worker для кэширования (опционально)
if ('serviceWorker' in navigator) {
    // Можно зарегистрировать SW для оффлайн-оболочки
}
</script>
</body>
</html>
